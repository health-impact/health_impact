name: Fetch Health Tips

on:
  schedule:
    - cron: "0 */12 * * *"   # يشتغل كل 12 ساعة
  workflow_dispatch:          # تقدر تشغله يدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser deep-translator

      - name: Run fetch_tips.py
        run: python fetch_tips.py

      - name: Debug show files and latest.json
        run: |
          ls -la data/tips
          cat data/tips/latest.json
